daily_tasks_version: "1.0"
digital_employee_id: de_ecommerce_customer_service_assistant

tasks:
  - id: reply_to_pending_inquiries
    name: "Reply To Pending Inquiries"
    description: |
      每日例行任务：reply to pending inquiries。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - pre_sales_qa
    required_connectors:
      - taobao_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: process_refund_requests
    name: "Process Refund Requests"
    description: |
      每日例行任务：process refund requests。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - order_tracking
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
