daily_tasks_version: "1.0"
digital_employee_id: de_recruitment_resume_screener

tasks:
  - id: screen_new_applications
    name: "Screen New Applications"
    description: |
      每日例行任务：screen new applications。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - resume_parsing
    required_connectors:
      - boss_zhipin_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: schedule_interviews
    name: "Schedule Interviews"
    description: |
      每日例行任务：schedule interviews。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - jd_matching
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
