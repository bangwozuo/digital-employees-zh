daily_tasks_version: "1.0"
digital_employee_id: de_finance_invoice_assistant

tasks:
  - id: scan_new_invoices
    name: "Scan New Invoices"
    description: |
      每日例行任务：scan new invoices。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - invoice_verification
    required_connectors:
      - tax_platform_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: verify_pending_expenses
    name: "Verify Pending Expenses"
    description: |
      每日例行任务：verify pending expenses。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - expense_audit
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
