daily_tasks_version: "1.0"
digital_employee_id: de_automation_office_table_assistant

tasks:
  - id: process_pending_spreadsheets
    name: "Process Pending Spreadsheets"
    description: |
      每日例行任务：process pending spreadsheets。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - spreadsheet_processing
    required_connectors:
      - excel_online_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: send_scheduled_emails
    name: "Send Scheduled Emails"
    description: |
      每日例行任务：send scheduled emails。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - email_batch_operation
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
