daily_tasks_version: "1.0"
digital_employee_id: de_legal_contract_review_assistant

tasks:
  - id: scan_pending_contracts
    name: "Scan Pending Contracts"
    description: |
      每日例行任务：scan pending contracts。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - contract_risk_scan
    required_connectors:
      - e_signature_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: update_compliance_rulebase
    name: "Update Compliance Rulebase"
    description: |
      每日例行任务：update compliance rulebase。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - compliance_check
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
