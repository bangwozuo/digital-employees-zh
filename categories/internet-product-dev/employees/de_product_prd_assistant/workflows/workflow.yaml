id: prd_to_ticket_flow
name: "Prd To Ticket Flow"
description: |
  场景工作流：prd to ticket flow。
  自动化执行 产品PRD助手 的核心业务流程。
version: "1.0.0"
author: "digital-employee-community"
type: "scenario_workflow"

triggers:
  - type: "manual"
    config:
      description: "用户手动触发"
  - type: "scheduled"
    config:
      cron_expression: "0 9 * * *"
      timezone: "Asia/Shanghai"

steps:
  - id: "start"
    name: "Start"
    type: "start"
    next: "prepare"

  - id: "prepare"
    name: "Prepare Context"
    type: "skill"
    skill_id: "prd_generation"
    next: "execute"

  - id: "execute"
    name: "Execute Core Logic"
    type: "skill"
    skill_id: "user_story_splitting"
    next: "notify"

  - id: "notify"
    name: "Send Notification"
    type: "connector"
    connector_id: "jira_api"
    next: "end"

  - id: "end"
    name: "End"
    type: "end"

quality:
  test_coverage: 0.75
  risk_level: "low"
  max_execution_minutes: 10
