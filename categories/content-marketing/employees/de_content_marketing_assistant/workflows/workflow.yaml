id: content_calendar_pipeline
name: "Content Calendar Pipeline"
description: |
  场景工作流：content calendar pipeline。
  自动化执行 内容营销助手 的核心业务流程。
version: "1.0.0"
author: "digital-employee-community"
type: "scenario_workflow"

triggers:
  - type: "manual"
    config:
      description: "用户手动触发"
  - type: "scheduled"
    config:
      cron_expression: "0 9 * * *"
      timezone: "Asia/Shanghai"

steps:
  - id: "start"
    name: "Start"
    type: "start"
    next: "prepare"

  - id: "prepare"
    name: "Prepare Context"
    type: "skill"
    skill_id: "topic_mining"
    next: "execute"

  - id: "execute"
    name: "Execute Core Logic"
    type: "skill"
    skill_id: "multi_platform_adaptation"
    next: "notify"

  - id: "notify"
    name: "Send Notification"
    type: "connector"
    connector_id: "wechat_official"
    next: "end"

  - id: "end"
    name: "End"
    type: "end"

quality:
  test_coverage: 0.75
  risk_level: "low"
  max_execution_minutes: 10
