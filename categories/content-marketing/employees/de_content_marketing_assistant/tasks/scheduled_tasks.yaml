scheduled_tasks_version: "1.0"
digital_employee_id: de_content_marketing_assistant

tasks:
  - id: weekly_content_performance_report
    name: "Weekly Content Performance Report"
    description: |
      定时任务：weekly content performance report。
    priority: "high"
    cron_expression: "0 9 * * 1"
    timezone: "Asia/Shanghai"
    estimated_duration_minutes: 30
    required_skills:
      - topic_mining
    required_connectors:
      - wechat_official
    auto_execute: true
    fallback_action: "notify_admin"
    retry_policy:
      max_retries: 3
      backoff_seconds: 60

  - id: monthly_competitor_content_audit
    name: "Monthly Competitor Content Audit"
    description: |
      定时任务：monthly competitor content audit。
    priority: "medium"
    cron_expression: "0 10 1 * *"
    timezone: "Asia/Shanghai"
    estimated_duration_minutes: 45
    required_skills:
      - multi_platform_adaptation
    required_connectors:
      - xiaohongshu_api
    auto_execute: true
    fallback_action: "notify_admin"
    retry_policy:
      max_retries: 2
      backoff_seconds: 300
