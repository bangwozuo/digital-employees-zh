daily_tasks_version: "1.0"
digital_employee_id: de_content_marketing_assistant

tasks:
  - id: scan_trending_topics
    name: "Scan Trending Topics"
    description: |
      每日例行任务：scan trending topics。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - topic_mining
    required_connectors:
      - wechat_official
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: draft_daily_posts
    name: "Draft Daily Posts"
    description: |
      每日例行任务：draft daily posts。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - multi_platform_adaptation
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
