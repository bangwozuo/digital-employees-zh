daily_tasks_version: "1.0"
digital_employee_id: de_data_analysis_daily_report_assistant

tasks:
  - id: generate_morning_report
    name: "Generate Morning Report"
    description: |
      每日例行任务：generate morning report。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - daily_report_generation
    required_connectors:
      - mysql_connector
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: check_anomaly_alerts
    name: "Check Anomaly Alerts"
    description: |
      每日例行任务：check anomaly alerts。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - anomaly_detection
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
