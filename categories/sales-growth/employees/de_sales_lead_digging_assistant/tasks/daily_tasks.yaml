daily_tasks_version: "1.0"
digital_employee_id: de_sales_lead_digging_assistant

tasks:
  - id: score_new_leads
    name: "Score New Leads"
    description: |
      每日例行任务：score new leads。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - lead_scoring
    required_connectors:
      - linkedin_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: draft_personalized_outreach
    name: "Draft Personalized Outreach"
    description: |
      每日例行任务：draft personalized outreach。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - outreach_drafting
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
