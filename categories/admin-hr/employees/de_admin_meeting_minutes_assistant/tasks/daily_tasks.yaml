daily_tasks_version: "1.0"
digital_employee_id: de_admin_meeting_minutes_assistant

tasks:
  - id: transcribe_meeting_recordings
    name: "Transcribe Meeting Recordings"
    description: |
      每日例行任务：transcribe meeting recordings。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - meeting_minutes_generation
    required_connectors:
      - feishu_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: follow_up_action_items
    name: "Follow Up Action Items"
    description: |
      每日例行任务：follow up action items。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - action_item_tracking
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
