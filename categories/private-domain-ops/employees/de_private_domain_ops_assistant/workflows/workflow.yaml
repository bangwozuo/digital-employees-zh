id: new_user_onboarding_sop
name: "New User Onboarding Sop"
description: |
  场景工作流：new user onboarding sop。
  自动化执行 私域运营助手 的核心业务流程。
version: "1.0.0"
author: "digital-employee-community"
type: "scenario_workflow"

triggers:
  - type: "manual"
    config:
      description: "用户手动触发"
  - type: "scheduled"
    config:
      cron_expression: "0 9 * * *"
      timezone: "Asia/Shanghai"

steps:
  - id: "start"
    name: "Start"
    type: "start"
    next: "prepare"

  - id: "prepare"
    name: "Prepare Context"
    type: "skill"
    skill_id: "community_sop_execution"
    next: "execute"

  - id: "execute"
    name: "Execute Core Logic"
    type: "skill"
    skill_id: "user_segmentation"
    next: "notify"

  - id: "notify"
    name: "Send Notification"
    type: "connector"
    connector_id: "wechat_work_api"
    next: "end"

  - id: "end"
    name: "End"
    type: "end"

quality:
  test_coverage: 0.75
  risk_level: "low"
  max_execution_minutes: 10
