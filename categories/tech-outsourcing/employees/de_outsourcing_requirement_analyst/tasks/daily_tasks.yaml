daily_tasks_version: "1.0"
digital_employee_id: de_outsourcing_requirement_analyst

tasks:
  - id: check_deliverable_submissions
    name: "Check Deliverable Submissions"
    description: |
      每日例行任务：check deliverable submissions。
    priority: "high"
    estimated_duration_minutes: 15
    required_skills:
      - requirement_clarification
    required_connectors:
      - github_api
    checklist:
      - "检查输入数据完整性"
      - "执行业务逻辑"
      - "记录执行日志"
    auto_execute: true
    fallback_action: "notify_admin"

  - id: update_project_risk_log
    name: "Update Project Risk Log"
    description: |
      每日例行任务：update project risk log。
    priority: "medium"
    estimated_duration_minutes: 10
    required_skills:
      - quote_estimation
    required_connectors: []
    checklist:
      - "准备素材"
      - "执行生成"
      - "审核输出"
    auto_execute: false
    fallback_action: "skip_and_log"
